<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Terminal</title>
<!--
  The terminal page (plan §6, "PTY terminals"; §5.2, "Harden the WebView").

  It is loaded from the app's own assets with no network access at all, and it talks to the host
  through exactly one JavaScript interface whose name is TERMINAL_BRIDGE. Everything the page can ask
  for is a typed message that the host validates before acting on it; see TerminalBridgeCodec.

  The page never opens a socket. OkHttp owns the WebSocket, and the page is handed output and the
  cursor — which is what keeps the credential out of the page and off the URL, and what lets a
  reconnect resume from a cursor the host read rather than one the page guessed.
-->
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #101216;
    overflow: hidden;
  }
  #terminal {
    width: 100%;
    height: 100%;
    /* The keyboard row below the WebView takes the soft keyboard away from the page, so the
       page must never try to scroll itself into view. */
    overflow: hidden;
  }
  /* A pinch on a terminal is a font-size change, not a page zoom: a zoomed page cuts lines. */
  #terminal {
    touch-action: none;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(function () {
  "use strict";

  // How many characters the page will hold. A terminal that has been open for a day can emit tens of
  // megabytes; xterm.js's own scrollback is the bound that matters for rendering, and this one is for
  // the buffer between the socket and the emulator.
  var SCROLLBACK = 5000;

  var bridge = window.OpenCodeTerminal || null;
  var term = new window.Terminal({
    convertEol: false,
    cursorBlink: true,
    scrollback: SCROLLBACK,
    fontSize: 13,
    fontFamily: "monospace",
    allowProposedApi: false,
    // The host owns the bridge, so the page must not open a window or follow a link: a terminal that
    // rendered a URL the server printed would be a WebView navigating off its assets, which is the
    // one thing the hardened settings are for.
    linkHandler: null
  });
  var fit = new window.FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));

  // Output arrives as a host message; the page never decides what it contains.
  function post(message) {
    if (bridge && typeof bridge.post === "function") {
      bridge.post(JSON.stringify(message));
    }
  }

  // Keystrokes and pastes leave through the same channel, and the host decides what a byte is.
  term.onData(function (data) {
    post({ type: "input", data: data });
  });

  // The selection is reported so the host can offer copy; the page cannot reach the clipboard itself
  // in a hardened WebView without a permission the user would have to grant.
  term.onSelectionChange(function () {
    var selection = term.getSelection();
    if (selection) {
      post({ type: "selection", data: selection });
    }
  });

  // Every layout change is a grid, and the host turns it into a `pty.update`.
  function reportSize() {
    try {
      fit.fit();
    } catch (ignored) {
      return;
    }
    post({ type: "resize", cols: term.cols, rows: term.rows });
  }

  window.addEventListener("resize", reportSize);
  window.addEventListener("orientationchange", reportSize);
  // A soft keyboard opening changes the viewport height, which changes the grid.
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", reportSize);
  }

  // A pinch changes the font size, and the grid has to be recomputed from the new cell size rather
  // than from the page's own zoom.
  var fontSize = 13;
  var startDistance = 0;
  function distance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  document.addEventListener("touchstart", function (event) {
    if (event.touches.length === 2) {
      startDistance = distance(event.touches);
    }
  }, { passive: true });
  document.addEventListener("touchend", function (event) {
    if (event.touches.length !== 2 || startDistance === 0) {
      return;
    }
    var ratio = distance(event.touches) / startDistance;
    startDistance = 0;
    if (ratio > 1.12) {
      fontSize = Math.min(28, fontSize + 1);
    } else if (ratio < 0.89) {
      fontSize = Math.max(8, fontSize - 1);
    } else {
      return;
    }
    term.options.fontSize = fontSize;
    reportSize();
  }, { passive: true });

  // What the host sends. Every call is `window.__terminal.<method>(<message>)`, where <message> is the
  // JSON object the host's TerminalBridgeCodec encoded — `{"type":"output","data":"..."}`,
  // `{"type":"cursor","cursor":n}`, `{"type":"state","state":"live","cursor":n}` — written as a literal,
  // so the text inside it can never end the string it is in. The page validates nothing because it has
  // nothing to decide, and a malformed host message is a bug in the app rather than an attack.
  //
  // `write` used to take a bare string and the host has always sent the object, so every chunk of output
  // was ignored without a word: a terminal that was connected, resized and completely blank. A bare
  // string is still accepted; an object is read for its `data`.
  var lastCursor = null;
  var streamState = "idle";

  function outputOf(message) {
    if (typeof message === "string") {
      return message;
    }
    return message && typeof message.data === "string" ? message.data : "";
  }

  window.__terminal = {
    write: function (message) {
      var text = outputOf(message);
      if (text.length > 0) {
        term.write(text);
      }
    },
    // A new socket replays the server's whole retained buffer from the start, so the screen and the
    // scrollback are emptied first; without it a reconnect draws every line twice.
    reset: function () {
      term.reset();
    },
    // The cursor and the state are the host's to keep and the page's only to show. Neither is posted
    // back: the host already has both, and a "cursor" or "state" message is one its codec refuses.
    cursor: function (message) {
      if (message && typeof message.cursor === "number") {
        lastCursor = message.cursor;
      }
    },
    state: function (message) {
      if (message && typeof message.state === "string") {
        streamState = message.state;
        // A terminal that is not following the server is one whose screen may be stale.
        document.getElementById("terminal").style.opacity =
          streamState === "live" || streamState === "connecting" ? "1" : "0.55";
      }
      if (message && typeof message.cursor === "number") {
        lastCursor = message.cursor;
      }
    },
    // The host sends every buffered chunk on one tick, so a terminal that was written to before the
    // page was ready gets its whole replay in order.
    ready: function () {
      post({ type: "ready" });
      reportSize();
    }
  };

  post({ type: "ready" });
  reportSize();
})();
</script>
</body>
</html>
