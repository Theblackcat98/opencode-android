org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Allow Gradle to automatically download missing Java toolchains if needed
org.gradle.java.installations.auto-download=true

# Dependencies (Compose 1.12.1, Hilt 1.4.0, etc.) declare compileSdk 37 in their
# AAR metadata, but Google hasn't published platforms;android-37 yet (preview
# channel only). The code uses no API 37 features, so disable the AAR metadata
# compileSdk check until the platform is available.
android.experimental.disableCompileSdkChecks=true
