[versions]
# Toolchain
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
jvmTarget = "17"

# Android SDK levels (build-logic reads these)
minSdk = "26"
compileSdk = "37"
targetSdk = "36"

# AndroidX / Compose
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxSplashscreen = "1.2.0"
androidxDatastore = "1.2.1"
androidxRoom = "2.8.5"
androidxHiltNavigation = "1.4.0"
composeBom = "2026.09.00"
material3Adaptive = "1.3.0"

# DI
hilt = "2.60.1"

# Kotlin libraries
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

# Networking
okhttp = "5.5.0"
zxing = "3.5.3"
retrofit = "3.0.0"

# Images & Camera
coil = "3.6.3"
camera = "1.6.1"
mlkitBarcode = "17.3.0"

# Testing
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
robolectric = "4.17"
roborazzi = "1.75.0"
turbine = "1.2.1"

# Quality
spotless = "8.10.3"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
