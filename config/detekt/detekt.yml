# detekt configuration (plan §3, Quality).
#
# The defaults are kept and this file narrows them to what this codebase can actually hold. Each
# entry says what it is for, because a linter configuration nobody can explain is one nobody dares
# to change, and a linter nobody dares to change is how it stops being enforced.
#
# **No baseline.** A baseline is how "zero findings" is faked: every existing finding gets listed
# and the rule stops mattering for exactly the code that needed it most. Findings are fixed or the
# rule is turned off here, with the reason.

# detekt 2.x fails on any finding unless told otherwise, so there is no `build:` block for the
# zero-findings claim. The 1.x `build.maxIssues` key is rejected by the 2.x schema.

complexity:
  LongParameterList:
    # The model types mirror published schemas, and a schema with fifteen required fields is a
    # fifteen-parameter constructor. Compressing them into builders would hide the shape.
    active: false
  LongMethod:
    # Compose screen hierarchies and event reducers (`TimelineReducer.reduce`) are declarative
    # trees that naturally exceed line counts; Detekt 2.x's LongMethod does not support annotation exclusions.
    active: false
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    active: true
    allowedDepth: 6
  CyclomaticComplexMethod:
    # The event dispatchers (`ServerDataSet.apply`, `SessionStore.apply`, `TimelineReducer.reduce`) match
    # 94 event types in a single `when`, and the lexers follow state machines with high branch counts.
    active: false
  ComplexCondition:
    active: true
    allowedConditions: 6
  LargeClass:
    # `ServerApi` declares every V2 endpoint in a single Retrofit interface (1600+ lines), which
    # `tools/audit-coverage.mjs` verifies as a single source of truth.
    active: false

style:
  MagicNumber:
    # HTTP status codes (400, 401, 403, 404, 409, 422, 500..599), bitwise masks, time math, and Compose
    # UI dimensions are pervasive across networking, design system, and error mapping.
    active: false
  MaxLineLength:
    # Aligns with Spotless/ktlint's 140 ceiling. Comments and raw multiline JSON/diff strings are excluded.
    # Excluded in test sources to match .editorconfig (where recorded events/fixtures are single long lines).
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
    excludeRawStrings: true
    excludes: ['**/test/**', '**/androidTest/**']
  ReturnCount:
    # Early returns in guard clauses, decoders, and pattern-matching parsers are standard idiomatic Kotlin.
    active: false
  MayBeConstant:
    # Test fixture objects often use camelCase val, which ktlint rejects if converted to const val.
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  LoopWithTooManyJumpStatements:
    # Network streaming loops (SSE event stream client) and line parsers naturally break on EOF and
    # continue on frame boundaries.
    active: false
  ThrowsCount:
    # Serializers and validators throw specific descriptive errors for each invalid field condition.
    active: false
  UnusedPrivateProperty:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedParameter:
    active: true
    allowedNames: 'ignored|expected|_.*'
  ForbiddenComment:
    active: true
    # The two comments in this repository that must never survive a merge: a disabled test and a
    # value left in from debugging.
    comments:
      - reason: 'A disabled test is a test that does not run.'
        value: 'TODO:fixme:'
      - reason: 'A disabled test is a test that does not run.'
        value: 'FIXME:'
      - reason: 'Debug output left in a shipped build.'
        value: 'STOPSHIP:'

exceptions:
  TooGenericExceptionCaught:
    # `catch (error: Throwable)` is the shape every boundary in this app uses: a Retrofit call
    # throws HttpException, a socket throws IOException, and a decoder throws SerializationException.
    # The catch is turned into a classified ActionError, which is the architectural convention.
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    active: true
    # Compose test helpers and Compose composables are PascalCase by convention, and the Roborazzi
    # capture helpers follow.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  ConstructorParameterNaming:
    # Model classes (e.g. `ConfigInfo`) mirror external JSON schemas that use snake_case properties.
    active: true
    parameterPattern: '[a-z][A-Za-z0-9_]*'
  FunctionParameterNaming:
    # Allows leading underscore for intentionally unused parameters.
    active: true
    parameterPattern: '[a-z_][A-Za-z0-9]*'
  MatchingDeclarationName:
    # Compose files are named for the primary Composable function (e.g. `ChangelogScreen.kt`), while
    # helper UI state and model classes reside alongside in the same file.
    active: false
