name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run API drift test
        run: node tools/check-api-drift.test.mjs

      - name: Run process-guard test
        run: node .opencode/plugins/process-guard.test.mjs

      - name: Check the coverage matrices
        run: node tools/audit-coverage.mjs --strict

      - name: Check the generated event corpus is current
        run: node tools/gen-event-payloads.mjs --check

      - name: Check every ViewModel can be built by Hilt
        run: |
          node tools/audit-viewmodels.test.mjs
          node tools/audit-viewmodels.mjs

      - name: Check every manual matrix row has a result
        run: |
          node tools/audit-matrix.test.mjs
          node tools/audit-matrix.mjs

      - name: Check every UI string is externalized
        # Plan 5.4: every string externalized from P0 on. A literal in a Text() or a
        # contentDescription is invisible to every locale, so this fails the build rather than
        # leaving it to a release checklist.
        run: |
          untranslated=$(node tools/audit-strings.mjs --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).findings.length))")
          if [ "$untranslated" != "0" ]; then
            echo "::error::$untranslated UI strings are not in strings.xml"
            node tools/audit-strings.mjs --per-module
            exit 1
          fi

      - name: Setup Android SDK
        run: ./scripts/setup-android-sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0

      - name: Verify publishable release task rejects missing signing material
        run: bash tools/test-release-gate.sh

      - name: Run Unit Tests
        run: ./gradlew unitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Assemble Debug APKs
        run: ./gradlew assembleDebug

  integration:
    name: Integration Tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install pinned OpenCode CLI
        run: npm install -g @opencode/cli@2.0.18

      - name: Setup Android SDK
        run: ./scripts/setup-android-sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0

      - name: Start pinned OpenCode dev server
        run: |
          set -euo pipefail
          # Keep the command-substitution status: eval "$(command)" can return success
          # even when command fails and emits no exports, which used to run integration
          # tests without a server and turn one startup failure into dozens of test failures.
          exports="$(./scripts/dev-server.sh start)"
          eval "$exports"
          {
            printf 'OPENCODE_URL=%s\n' "$OPENCODE_URL"
            printf 'OPENCODE_PASSWORD=%s\n' "$OPENCODE_PASSWORD"
            printf 'OPENCODE_DIRECTORY=%s\n' "$OPENCODE_DIRECTORY"
            printf 'OPENCODE_VERSION=%s\n' "$OPENCODE_VERSION"
            printf 'FAKE_PROVIDER_URL=%s\n' "$FAKE_PROVIDER_URL"
          } >> "$GITHUB_ENV"

      - name: Run Integration Tests
        run: ./gradlew integrationTest

      - name: Upload dev-server diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-dev-server-diagnostics
          path: |
            .dev-server/serve.log
            .dev-server/supervisor.log
            .dev-server/fake-provider.log
          if-no-files-found: warn
          retention-days: 7

      - name: Teardown Dev Server
        if: always()
        run: ./scripts/dev-server.sh stop || true
