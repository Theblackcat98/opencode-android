name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run API drift test
        run: node tools/check-api-drift.test.mjs

      - name: Run process-guard test
        run: node .opencode/plugins/process-guard.test.mjs

      - name: Setup Android SDK
        run: ./scripts/setup-android-sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew unitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Assemble Debug APKs
        run: ./gradlew assembleDebug

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned OpenCode CLI
        run: npm install -g @opencode/cli@2.0.18

      - name: Setup Android SDK
        run: ./scripts/setup-android-sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Integration Tests
        run: |
          eval "$(./scripts/dev-server.sh start)"
          ./gradlew integrationTest

      - name: Teardown Dev Server
        if: always()
        run: ./scripts/dev-server.sh stop || true
