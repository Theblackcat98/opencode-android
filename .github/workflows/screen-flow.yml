name: Screen Flow Screenshots

# Regenerates the docs/app_screen_flow.html screenshots from Roborazzi
# baselines on every push to main. No emulator needed — Roborazzi runs
# on JVM via Robolectric.
#
# The [skip ci] trailer on the auto-commit prevents an infinite loop.

on:
  push:
    branches: [main]
    paths:
      - 'feature/**/src/main/**'
      - 'core/**/src/main/**'
      - 'app/src/main/**'
      - 'tools/update-screen-flow-shots.mjs'

jobs:
  # Prefer the self-hosted runner (veritas) when it's online; fall back to
  # GitHub-hosted otherwise. A queued-forever job is worse than a slower one.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '.runners[] | select(.name == "veritas") | .status')
          if [ "$STATUS" = "online" ]; then
            echo "runner=self-hosted" >> "$GITHUB_OUTPUT"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  update-screenshots:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Full history so the push back doesn't conflict
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Android SDK
        run: ./scripts/setup-android-sdk.sh

      - name: Install ImageMagick
        run: |
          if ! command -v magick &> /dev/null; then
            if command -v dnf &> /dev/null; then
              sudo dnf install -y ImageMagick
            else
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
          fi

      - name: Record Roborazzi screenshots
        run: |
          ./gradlew \
            :feature:servers:testDebugUnitTest \
            :feature:sessions:testDebugUnitTest \
            :feature:composer:testDebugUnitTest \
            :feature:execution:testDebugUnitTest \
            :feature:review:testDebugUnitTest \
            :feature:integrations:testDebugUnitTest \
            :feature:admin:testDebugUnitTest \
            :feature:insights:testDebugUnitTest \
            -Proborazzi.test.record=true \
            --tests '*ScreenFlow*'

      - name: Update screen flow HTML
        run: node tools/update-screen-flow-shots.mjs

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app_screen_flow.html \
            feature/*/src/test/screenshots/docs-screen-*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "Refresh screen flow screenshots [skip ci]"
            git push
          fi
